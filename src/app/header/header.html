<header>
    <a routerLink="/">
        <img
            class="logo"
            [src]="whiteLogo() ? '/icons/portfolio_logo_white.svg' : '/icons/portfolio_logo_blue.svg'"
            alt="Logo"
        />
    </a>
    <nav>
        <a routerLink="/" fragment="about-me">{{ 'header.aboutMe' | translate }}</a>
        <a routerLink="/" fragment="skill-set">{{ 'header.skillSet' | translate }}</a>
        <a routerLink="/" fragment="my-work">{{ 'header.myWork' | translate }}</a>
    </nav>
    <app-language-switch />
    <button class="burger" (click)="toggleMenu()" aria-label="Menu">
        <img src="/icons/burger_menu.svg" alt="" />
    </button>
</header>

@if (menuOpen()) {
    <section class="mobile-menu">
        <div class="mobile-menu-top">
            <a routerLink="/" (click)="closeMenu()">
                <img class="logo" src="/icons/portfolio_logo_blue.svg" alt="Logo" />
            </a>
            <button class="burger" (click)="toggleMenu()" aria-label="Close menu">
                <img src="/icons/burger_menu.svg" alt="" />
            </button>
        </div>
        <nav class="mobile-nav">
            <a routerLink="/" fragment="about-me" (click)="closeMenu()">{{ 'header.aboutMe' | translate }}</a>
            <a routerLink="/" fragment="skill-set" (click)="closeMenu()">{{ 'header.skillSet' | translate }}</a>
            <a routerLink="/" fragment="my-work" (click)="closeMenu()">{{ 'header.myWork' | translate }}</a>
            <a routerLink="/" fragment="contact" (click)="closeMenu()">{{ 'header.contact' | translate }}</a>
            <app-language-switch [inMenu]="true" />
        </nav>
    </section>
}
