<article class="project" [class.reversed]="reversed()">
    <img [src]="'/images/' + project().image" [alt]="project().name" />
    <div class="project-text">
        <h3>{{ project().name }}</h3>
        <p class="technologies">{{ project().technologies }}</p>
        <p class="description">{{ project().descriptionKey | translate }}</p>
        <div class="project-links">
            @if (project().liveUrl) {
                <button class="button button-filled" type="button" (click)="openDemo()">
                    {{ 'projects.liveTest' | translate }}
                </button>
            }
            <a class="button" [href]="project().githubUrl" target="_blank">Github</a>
        </div>
    </div>

    <!-- Demo-Fenster über der Seite; der iframe entsteht erst beim Öffnen und verschwindet beim Schließen -->
    <dialog
        #demoDialog
        class="demo"
        [attr.aria-label]="project().name"
        (close)="onDialogClose()"
        (click)="onDialogClick($event)"
    >
        <div class="demo-window">
            <div class="demo-bar">
                <h4>{{ project().name }}</h4>
                <a class="demo-new-tab" [href]="project().liveUrl" target="_blank">
                    {{ 'projects.openInTab' | translate }}
                </a>
                <button
                    class="demo-close"
                    type="button"
                    (click)="closeDemo()"
                    [attr.aria-label]="'projects.closeDemo' | translate"
                >
                    ✕
                </button>
            </div>
            <!-- Ladeanzeige und Demo liegen übereinander; die Anzeige verschwindet, sobald die Demo geladen ist -->
            <div class="demo-body">
                @if (demoOpen()) {
                    <iframe
                        [src]="demoUrl()"
                        [title]="project().name"
                        allow="fullscreen; autoplay"
                        (load)="onDemoLoaded()"
                    ></iframe>
                }
                @if (demoLoading()) {
                    <div class="demo-loading">
                        <span class="demo-spinner" aria-hidden="true"></span>
                        <p>{{ 'projects.demoLoading' | translate }}</p>
                    </div>
                }
            </div>
        </div>
    </dialog>
</article>
