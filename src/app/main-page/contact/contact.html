<section class="contact" id="contact">
    <h2>{{ 'contact.title' | translate }}</h2>
    <div class="contact-content">
        <div class="contact-text">
            <h3>{{ 'contact.problem' | translate }}</h3>
            <p>{{ 'contact.text' | translate }}</p>
            <p class="need">
                {{ 'contact.need' | translate }} <strong>{{ 'contact.contactMe' | translate }}</strong>
            </p>
        </div>
        <form class="contact-form" [formGroup]="contactForm">
            <input type="text" formControlName="name" [placeholder]="'contact.name' | translate" />
            <input type="email" formControlName="email" [placeholder]="'contact.email' | translate" />
            <textarea formControlName="message" [placeholder]="'contact.message' | translate"></textarea>
            <label class="privacy">
                <input type="checkbox" formControlName="privacy" />
                <span>
                    {{ 'contact.privacyBefore' | translate }}
                    <a routerLink="/privacy-policy">{{ 'contact.privacyLink' | translate }}</a>
                    {{ 'contact.privacyAfter' | translate }}
                </span>
            </label>
            <button class="button" type="submit" disabled>{{ 'contact.send' | translate }}</button>
        </form>
    </div>
</section>
